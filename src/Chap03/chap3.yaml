  캐릭터 이름은 String, 레벨은 int, 체력과 마나는 적절한 숫자 자료형, 생존 여부는 boolean으로 저장한다. - v
    "   Penguin Knight   "처럼 앞뒤에 공백이 있는 캐릭터 이름을 하나 만들고, String 메소드를 이용해서 공백을 제거한다. - v
    캐릭터의 능력치를 배열 하나에 저장한다. 예를 들어 공격력/방어력/민첩성처럼 최소 3개의 능력치를 넣는다. - v
    전투를 한 번 했다고 가정하고 현재 체력 - 받은 피해량을 연산자로 계산한다. - v
    경험치도 현재 경험치 + 획득 경험치 형태로 계산한다. - v
    String.format() 또는 강의에서 배운 문자열 포매팅을 이용해서 최종 상태창을 출력한다. -v 
    변수 하나는 직접 타입을 적지 말고 var를 사용해본다. -v 
    null을 저장할 수 있는 String 변수도 하나 만들어서, 아직 길드에 가입하지 않았다는 상태를 표현해본다. -v